name: Openly
options:
  bundleIdPrefix: ink.openly
  deploymentTarget:
    iOS: "16.0"
targets:
  Openly:
    type: application
    platform: iOS
    sources:
      - path: Openly
        excludes:
          - SourceBundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.openly.app
        PRODUCT_NAME: Openly
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Openly/Info.plist
    postBuildScripts:
      - name: Build and embed Openly local web app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          MOBILE_DIR="$SRCROOT/../mobile-spa"
          PUBLIC_DIR="$MOBILE_DIR/public"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WebBundle"

          mkdir -p "$PUBLIC_DIR"
          cp "$SRCROOT/../app/icon.png" "$PUBLIC_DIR/icon.png"
          cp "$SRCROOT/../app/apple-icon.png" "$PUBLIC_DIR/apple-icon.png"

          cd "$MOBILE_DIR"
          npm install --no-audit --no-fund
          npm run build

          test -s "$MOBILE_DIR/dist/index.html"
          test -n "$(find "$MOBILE_DIR/dist/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$MOBILE_DIR/dist/assets" -type f -name '*.css' -print -quit)"

          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$MOBILE_DIR/dist/." "$DEST/"

          test -s "$DEST/index.html"
          WEB_KB=$(du -sk "$DEST" | awk '{print $1}')
          if [ "$WEB_KB" -lt 300 ]; then
            echo "Embedded Openly bundle is unexpectedly small: ${WEB_KB} KB"
            exit 1
          fi

          echo "Embedded Openly web bundle:"
          du -sh "$DEST"
          find "$DEST" -maxdepth 2 -type f -print | sort | head -100
