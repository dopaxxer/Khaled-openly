name: Openly
options:
  bundleIdPrefix: ink.openly
  deploymentTarget:
    iOS: "16.0"
targets:
  Openly:
    type: application
    platform: iOS
    sources:
      - path: Openly
        excludes:
          - SourceBundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.openly.app
        PRODUCT_NAME: Openly
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Openly/Info.plist
    postBuildScripts:
      - name: Embed verified Openly local web app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          WEB_SOURCE="$SRCROOT/../mobile-spa/dist"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WebBundle"

          test -s "$WEB_SOURCE/index.html"
          test -n "$(find "$WEB_SOURCE/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$WEB_SOURCE/assets" -type f -name '*.css' -print -quit)"

          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$WEB_SOURCE/." "$DEST/"

          test -s "$DEST/index.html"
          test -n "$(find "$DEST/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$DEST/assets" -type f -name '*.css' -print -quit)"

          WEB_KB=$(du -sk "$DEST" | awk '{print $1}')
          if [ "$WEB_KB" -lt 300 ]; then
            echo "Embedded Openly bundle is unexpectedly small: ${WEB_KB} KB"
            exit 1
          fi

          echo "Embedded Openly web bundle:"
          du -sh "$DEST"
          find "$DEST" -maxdepth 2 -type f -print | sort | head -100
