name: Openly
options:
  bundleIdPrefix: ink.openly
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_LANGUAGE: ar
targets:
  Openly:
    type: application
    platform: iOS
    sources:
      - path: Openly
    dependencies:
      - package: GoogleSignIn
    entitlements:
      path: Openly/Openly.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Openly/Info.plist
      properties:
        CFBundleDisplayName: open
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "4"
        CFBundleLocalizations:
          - ar
          - en
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.openly.app
        PRODUCT_NAME: Openly
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        GOOGLE_IOS_CLIENT_ID: "$(GOOGLE_IOS_CLIENT_ID)"
        GOOGLE_REVERSED_CLIENT_ID: "$(GOOGLE_REVERSED_CLIENT_ID)"
    # Attaches the unit tests to the Openly scheme so `xcodebuild test` picks
    # them up. Test targets are only built for the test action, so the release
    # and IPA builds are unaffected.
    scheme:
      testTargets:
        - OpenlyTests

  OpenlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenlyTests
    dependencies:
      - target: Openly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.openly.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Hosted by the app so `@testable import Openly` can reach the
        # internal parser and folding helpers.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Openly.app/Openly"
        BUNDLE_LOADER: "$(TEST_HOST)"
