name: Web quality and security

on:
  push:
    branches:
      - main
      - claude/website-design-modernize-lkp0ts
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'proxy.js'
      - 'netlify.toml'
      - '.github/workflows/ui-redesign-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'proxy.js'
      - 'netlify.toml'
      - '.github/workflows/ui-redesign-check.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Live auth preview smoke
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 42
        env:
          PREVIEW_ORIGIN: https://deploy-preview-42--inspiring-swan-ab4737.netlify.app
          AUTH_SMOKE_EMAIL: auth-smoke-${{ github.run_id }}@openly.ink
        run: |
          set -euo pipefail

          html="$(curl --fail --silent --show-error --location "$PREVIEW_ORIGIN/login")"
          grep -q "Continue with Apple" <<<"$html"
          grep -q "Continue with Google" <<<"$html"
          grep -q "المتابعة برقم الهاتف" <<<"$html"

          body="$(curl --fail --silent --show-error             -H 'content-type: application/json'             --data "{\"method\":\"email\",\"email\":\"$AUTH_SMOKE_EMAIL\"}"             "$PREVIEW_ORIGIN/api/auth/otp/request")"
          grep -q '"ok":true' <<<"$body"
          grep -q '"method":"email"' <<<"$body"
          ! grep -q "$AUTH_SMOKE_EMAIL" <<<"$body"

          status="$(curl --silent --show-error             -o /tmp/verify.json -w '%{http_code}'             -H 'content-type: application/json'             --data "{\"method\":\"email\",\"email\":\"$AUTH_SMOKE_EMAIL\",\"token\":\"000000\"}"             "$PREVIEW_ORIGIN/api/auth/otp/verify")"
          test "$status" = "400"
          grep -q '"error":' /tmp/verify.json

          status="$(curl --silent --show-error             -o /tmp/phone.json -w '%{http_code}'             -H 'content-type: application/json'             --data '{"method":"phone","phone":"49123"}'             "$PREVIEW_ORIGIN/api/auth/otp/request")"
          test "$status" = "400"

          for provider in google apple; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null               "$PREVIEW_ORIGIN/api/auth/oauth/$provider?next=/")"
            status="$(awk 'NR==1 {print $2}' <<<"$headers")"
            case "$status" in
              301|302|303|307|308) ;;
              *) echo "$provider OAuth did not redirect: $status" >&2; exit 1 ;;
            esac
          done
