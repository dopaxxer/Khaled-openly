name: Web quality and security

on:
  push:
    branches:
      - main
      - claude/website-design-modernize-lkp0ts
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'proxy.js'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      # The web suite asserts against the native client's origin, so an
      # iOS-only change can turn it red. Run it here rather than discovering
      # the break on the next unrelated web pull request.
      - 'ios/project.yml'
      - 'ios/Openly/APIClient.swift'
      - '.github/workflows/ui-redesign-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'proxy.js'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      # The web suite asserts against the native client's origin, so an
      # iOS-only change can turn it red. Run it here rather than discovering
      # the break on the next unrelated web pull request.
      - 'ios/project.yml'
      - 'ios/Openly/APIClient.swift'
      - '.github/workflows/ui-redesign-check.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Builds the Next.js bundle and adapts it into .open-next/worker.js -- the
      # exact artifact Cloudflare deploys. Running it here is the point: the
      # Workers build lives in the Cloudflare dashboard, so without this step a
      # change that breaks the production Worker passes every check on the pull
      # request and only fails after merge, where nobody is watching.
      #
      # The NEXT_PUBLIC_* values are placeholders. They exist because Next.js
      # inlines them at build time, so the build needs them present; the real
      # values are set as build variables on the Cloudflare project.
      - name: Build the Cloudflare Worker
        env:
          NEXT_PUBLIC_SITE_URL: https://openly.ink
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          AUTH_EMAIL_MODE: otp
        run: npm run build

      - name: Confirm the Worker entrypoint was produced
        run: test -f .open-next/worker.js && test -d .open-next/assets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

