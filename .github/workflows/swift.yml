name: Swift

on:
  push:
    branches:
      - main
      - claude/website-design-modernize-lkp0ts
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build SwiftUI app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-swift-check \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # Kept as a separate job so a problem with the test bundle is visible on its
  # own and never masks the state of the app build above.
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run model, mention and music unit tests
        working-directory: ios
        run: |
          set -euo pipefail

          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              for device in devices:
                  if device.get("isAvailable") and device.get("udid"):
                      print(device["udid"])
                      raise SystemExit
          ')"

          if [ -n "$simulator_id" ]; then
            destination="platform=iOS Simulator,id=$simulator_id"
          else
            # Some macos-15 runner images currently expose no installed iOS
            # simulator runtime, while Xcode still exposes the native
            # Apple-silicon "Designed for iPad/iPhone" destination.
            destination='platform=macOS,arch=arm64,variant=Designed for [iPad,iPhone]'
          fi

          echo "Testing on: $destination"
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Debug \
            -destination "$destination" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test
