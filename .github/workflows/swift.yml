name: Swift

on:
  push:
    branches:
      - main
      - claude/website-design-modernize-lkp0ts
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          python3 generate_icons.py
          xcodegen generate

      - name: Build SwiftUI app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-swift-check \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # Kept as a separate job so a problem with the test bundle is visible on its
  # own and never masks the state of the app build above.
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          python3 generate_icons.py
          xcodegen generate

      - name: Run model and native launch tests on iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/openly-simulators.json
          simulator_id="$(python3 -c 'import json; d=json.load(open("/tmp/openly-simulators.json")); print(next((x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]), ""))')"
          test -n "$simulator_id" || { echo '::error::No iOS Simulator is available; tests were not executed.'; exit 1; }
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Debug \
            -derivedDataPath build-tests \
            -resultBundlePath Openly-tests.xcresult \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload test results and launch screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Openly-native-test-results
          path: ios/Openly-tests.xcresult
          if-no-files-found: warn
