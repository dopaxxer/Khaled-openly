name: Swift

on:
  push:
    branches:
      - main
      - claude/website-design-modernize-lkp0ts
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/swift.yml'

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build SwiftUI app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-swift-check \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # Kept as a separate job so a problem with the test bundle is visible on its
  # own and never masks the state of the app build above.
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run or compile model, mention and music unit tests
        working-directory: ios
        run: |
          set -euo pipefail

          destinations="$(xcodebuild -project Openly.xcodeproj -scheme Openly -showdestinations)"
          simulator_id="$(printf '%s\n' "$destinations" | sed -n 's/.*{ platform:iOS Simulator, arch:arm64, id:\([^,]*\),.*/\1/p' | head -n 1)"


          common_args=(
            -project Openly.xcodeproj
            -scheme Openly
            -configuration Debug
            -derivedDataPath build-tests
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
          )

          if [ -n "$simulator_id" ]; then
            echo "Running tests on iOS Simulator: $simulator_id"
            xcodebuild "${common_args[@]}" \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              test
          else
            # GitHub occasionally publishes a macos-15 image with Xcode but no
            # installed iOS simulator runtime. In that case test execution is
            # impossible on the runner, but compiling the app + hosted XCTest
            # bundle still catches contract/type/build regressions instead of
            # failing for a missing device.
            echo "::warning::No iOS Simulator runtime is installed; compiling the XCTest bundle instead."
            xcodebuild "${common_args[@]}" \
              -sdk iphonesimulator \
              build-for-testing
          fi
