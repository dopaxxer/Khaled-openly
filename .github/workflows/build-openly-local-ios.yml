name: Build Openly Local iOS App

on:
  push:
    branches:
      - ios-pr3-test-app
    paths:
      - 'mobile-spa/**'
      - '.github/workflows/build-openly-local-ios.yml'
  pull_request:
    paths:
      - 'mobile-spa/**'
      - '.github/workflows/build-openly-local-ios.yml'
  workflow_dispatch:

jobs:
  build-local-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout PR3 mobile branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare local brand assets
        run: |
          mkdir -p mobile-spa/public
          cp app/icon.png mobile-spa/public/icon.png
          cp app/apple-icon.png mobile-spa/public/apple-icon.png

      - name: Install mobile dependencies
        working-directory: mobile-spa
        run: npm install --no-audit --no-fund

      - name: Build local React bundle
        working-directory: mobile-spa
        run: |
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
          echo "Local web bundle:"
          du -sh dist
          find dist -maxdepth 2 -type f -print | sort

      - name: Generate native iOS project with Capacitor
        working-directory: mobile-spa
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Apply Openly app metadata and icon
        working-directory: mobile-spa
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Openly" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Openly" "$PLIST"
          ICON_FILE=$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -type f -name '*.png' | head -1 || true)
          if [ -n "$ICON_FILE" ]; then
            sips -z 1024 1024 ../app/icon.png --out "$ICON_FILE" >/dev/null
          fi

      - name: Build unsigned iPhone application
        working-directory: mobile-spa
        run: |
          rm -rf build
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              PRODUCT_BUNDLE_IDENTIFIER=ink.openly.app \
              PRODUCT_NAME=Openly \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              PRODUCT_BUNDLE_IDENTIFIER=ink.openly.app \
              PRODUCT_NAME=Openly \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi

      - name: Verify this is a bundled app, not a remote shell
        working-directory: mobile-spa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          test -s "$APP_PATH/public/index.html"
          test -n "$(find "$APP_PATH/public/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$APP_PATH/public/assets" -type f -name '*.css' -print -quit)"
          WEB_KB=$(du -sk "$APP_PATH/public" | awk '{print $1}')
          if [ "$WEB_KB" -lt 300 ]; then
            echo "Bundled web payload is unexpectedly small: ${WEB_KB} KB"
            exit 1
          fi
          echo "Native app size:"
          du -sh "$APP_PATH"
          echo "Bundled web payload:"
          du -sh "$APP_PATH/public"
          echo "Bundled files:"
          find "$APP_PATH/public" -maxdepth 2 -type f -print | sort | head -100

      - name: Package unsigned IPA
        working-directory: mobile-spa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          rm -rf Payload Openly-PR3-local-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Openly.app
          zip -qry Openly-PR3-local-unsigned.ipa Payload
          IPA_KB=$(du -k Openly-PR3-local-unsigned.ipa | awk '{print $1}')
          if [ "$IPA_KB" -lt 300 ]; then
            echo "IPA is unexpectedly small: ${IPA_KB} KB"
            exit 1
          fi
          ls -lh Openly-PR3-local-unsigned.ipa

      - name: Upload verified local IPA
        uses: actions/upload-artifact@v4
        with:
          name: Openly-PR3-local-bundle-unsigned-ipa
          path: mobile-spa/Openly-PR3-local-unsigned.ipa
          if-no-files-found: error
