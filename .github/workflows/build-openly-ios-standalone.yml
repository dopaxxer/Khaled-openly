name: Build Openly Standalone IPA

on:
  push:
    branches:
      - openly-ios-standalone-v2
    paths:
      - 'ios/**'
      - '.github/workflows/build-openly-ios-standalone.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-openly-ios-standalone.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle Openly web project source
        run: |
          rm -rf ios/Openly/SourceBundle
          mkdir -p ios/Openly/SourceBundle
          cp -R app ios/Openly/SourceBundle/app
          cp -R components ios/Openly/SourceBundle/components
          cp -R lib ios/Openly/SourceBundle/lib
          cp package.json ios/Openly/SourceBundle/package.json
          cp package-lock.json ios/Openly/SourceBundle/package-lock.json
          cp proxy.js ios/Openly/SourceBundle/proxy.js
          cp README.md ios/Openly/SourceBundle/README.md
          test -f ios/Openly/SourceBundle/app/page.jsx

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify bundled project source
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Openly.app"
          test -d "$APP_PATH"
          find "$APP_PATH" -maxdepth 4 -type f | sort | head -100
          du -sh "$APP_PATH"

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Openly.app"
          rm -rf Payload Openly-Standalone-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Openly.app
          zip -qry Openly-Standalone-unsigned.ipa Payload
          ls -lh Openly-Standalone-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Openly-Standalone-unsigned-ipa
          path: ios/Openly-Standalone-unsigned.ipa
          if-no-files-found: error
