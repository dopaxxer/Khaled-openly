name: Build Openly Local Web Bundle

on:
  push:
    branches:
      - ios-pr3-local-bundle-v2
    paths:
      - 'mobile-spa/package.json'
      - 'mobile-spa/vite.config.js'
      - 'mobile-spa/index.html'
      - 'mobile-spa/capacitor.config.json'
      - 'mobile-spa/src/**'
      - '.github/workflows/build-openly-ios-standalone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ios-pr3-local-bundle-v2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and record result
        shell: bash
        run: |
          set +e
          mkdir -p mobile-spa/public
          cp app/icon.png mobile-spa/public/icon.png
          cp app/apple-icon.png mobile-spa/public/apple-icon.png
          cd mobile-spa
          npm install --no-audit --no-fund > /tmp/openly-build.log 2>&1
          INSTALL_CODE=$?
          BUILD_CODE=$INSTALL_CODE
          if [ "$INSTALL_CODE" -eq 0 ]; then
            npm run build >> /tmp/openly-build.log 2>&1
            BUILD_CODE=$?
          fi
          tail -400 /tmp/openly-build.log > build.log
          if [ "$BUILD_CODE" -eq 0 ] && [ -s dist/index.html ] && [ -n "$(find dist/assets -type f -name '*.js' -print -quit 2>/dev/null)" ]; then
            echo "success" > build-status.txt
            du -sh dist >> build.log
            find dist -maxdepth 2 -type f -print | sort >> build.log
          else
            echo "failed:${BUILD_CODE}" > build-status.txt
          fi
          exit 0

      - name: Persist build output and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile-spa/build-status.txt mobile-spa/build.log
          if [ -d mobile-spa/dist ]; then git add -f mobile-spa/dist; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CI: persist Openly local mobile bundle"
          git push origin HEAD:ios-pr3-local-bundle-v2
