name: Build Openly Native IPA

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate app icons
        working-directory: ios
        run: python3 generate_icons.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build native iPhone app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=4 \
            MARKETING_VERSION=1.0.0 \
            build

      - name: Confirm app is native
        working-directory: ios
        run: |
          test -d build/Build/Products/Release-iphoneos/Openly.app
          plutil -lint build/Build/Products/Release-iphoneos/Openly.app/Info.plist
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          test "$bundle_identifier" = "ink.openly.app" || { echo "Unexpected bundle identifier: $bundle_identifier" >&2; exit 1; }
          test "$bundle_version" = "4" || { echo "Unexpected build number: $bundle_version" >&2; exit 1; }
          if grep -R "WKWebView\|WebKit" Openly --include='*.swift'; then
            echo "Web wrapper code found" >&2
            exit 1
          fi

      - name: Package native IPA
        working-directory: ios
        run: |
          rm -rf Payload Openly-native.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Openly.app Payload/Openly.app
          zip -qry Openly-native.ipa Payload
          shasum -a 256 Openly-native.ipa > Openly-native.ipa.sha256

      - name: Upload native IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Openly-native-ipa
          path: |
            ios/Openly-native.ipa
            ios/Openly-native.ipa.sha256
          if-no-files-found: error
