name: Build Openly IPA

on:
  pull_request:
    paths:
      - 'mobile-spa/**'
      - '.github/workflows/build-ios-ipa.yml'
  push:
    branches:
      - ios-pr3-local-bundle-v2
    paths:
      - 'mobile-spa/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare brand assets
        run: |
          mkdir -p mobile-spa/public
          cp app/icon.png mobile-spa/public/icon.png
          cp app/apple-icon.png mobile-spa/public/apple-icon.png
      - name: Install dependencies
        working-directory: mobile-spa
        run: npm install --no-audit --no-fund
      - name: Build embedded web app
        working-directory: mobile-spa
        run: |
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
          du -sh dist
      - name: Generate Capacitor iOS project
        working-directory: mobile-spa
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Apply Openly metadata and icon
        working-directory: mobile-spa
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Openly" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Openly" "$PLIST"
          ICON_FILE=$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -type f -name '*.png' | head -1 || true)
          if [ -n "$ICON_FILE" ]; then sips -z 1024 1024 ../app/icon.png --out "$ICON_FILE" >/dev/null; fi
      - name: Build unsigned iPhone app
        working-directory: mobile-spa
        run: |
          rm -rf build
          if [ -d ios/App/App.xcworkspace ]; then PROJECT_ARGS=(-workspace ios/App/App.xcworkspace); else PROJECT_ARGS=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${PROJECT_ARGS[@]}" -scheme App -configuration Release -sdk iphoneos -derivedDataPath build PRODUCT_BUNDLE_IDENTIFIER=ink.openly.app PRODUCT_NAME=Openly CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify local assets are inside Openly.app
        working-directory: mobile-spa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          test -s "$APP_PATH/public/index.html"
          test -n "$(find "$APP_PATH/public/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$APP_PATH/public/assets" -type f -name '*.css' -print -quit)"
          WEB_KB=$(du -sk "$APP_PATH/public" | awk '{print $1}')
          if [ "$WEB_KB" -lt 300 ]; then echo "Embedded web payload too small: ${WEB_KB} KB"; exit 1; fi
          echo "App size:" && du -sh "$APP_PATH"
          echo "Embedded UI size:" && du -sh "$APP_PATH/public"
          find "$APP_PATH/public" -maxdepth 2 -type f -print | sort | head -100
      - name: Package unsigned IPA
        working-directory: mobile-spa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          rm -rf Payload Openly-PR3-local-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Openly.app
          zip -qry Openly-PR3-local-unsigned.ipa Payload
          IPA_KB=$(du -k Openly-PR3-local-unsigned.ipa | awk '{print $1}')
          if [ "$IPA_KB" -lt 300 ]; then echo "IPA too small: ${IPA_KB} KB"; exit 1; fi
          ls -lh Openly-PR3-local-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Openly-PR3-local-bundle-unsigned-ipa
          path: mobile-spa/Openly-PR3-local-unsigned.ipa
          if-no-files-found: error
