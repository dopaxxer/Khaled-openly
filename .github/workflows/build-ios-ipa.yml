name: Build Openly Native IPA

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Test IPA validation
        run: python3 -m unittest discover -s ios/ci -p 'test_*.py'

      - name: Generate app icons
        working-directory: ios
        run: python3 generate_icons.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build native iPhone app
        working-directory: ios
        run: |
          build_number="$(awk '/CURRENT_PROJECT_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          test -n "$build_number"
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MARKETING_VERSION=1.0.0 \
            build

      - name: Confirm app is native
        working-directory: ios
        run: |
          test -d build/Build/Products/Release-iphoneos/Openly.app
          plutil -lint build/Build/Products/Release-iphoneos/Openly.app/Info.plist
          expected_build_number="$(awk '/CURRENT_PROJECT_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          api_base_url="$(/usr/libexec/PlistBuddy -c 'Print :OpenlyAPIBaseURL' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          test "$bundle_identifier" = "ink.openly.app" || { echo "Unexpected bundle identifier: $bundle_identifier" >&2; exit 1; }
          test -n "$expected_build_number" || { echo "Missing CURRENT_PROJECT_VERSION in project.yml" >&2; exit 1; }
          test "$bundle_version" = "$expected_build_number" || { echo "Unexpected build number: $bundle_version (expected $expected_build_number)" >&2; exit 1; }
          test "$display_name" = "Openly" || { echo "Unexpected display name: $display_name" >&2; exit 1; }
          test "$api_base_url" = "https://openly.nootjetzt.workers.dev/api/" || { echo "Unexpected API base URL: $api_base_url" >&2; exit 1; }
          google_client_id="$(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          google_server_client_id="$(/usr/libexec/PlistBuddy -c 'Print :GIDServerClientID' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          google_scheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' build/Build/Products/Release-iphoneos/Openly.app/Info.plist)"
          test "$google_client_id" = "536812654632-lk6vucd897n0jqdvgmejmed025f6soim.apps.googleusercontent.com" || { echo "Unexpected Google iOS client ID" >&2; exit 1; }
          test "$google_server_client_id" = "536812654632-elrmj9nv1aqte2r3en6ihfjn5al358rc.apps.googleusercontent.com" || { echo "Unexpected Google server client ID" >&2; exit 1; }
          test "$google_scheme" = "com.googleusercontent.apps.536812654632-lk6vucd897n0jqdvgmejmed025f6soim" || { echo "Unexpected Google reversed client ID" >&2; exit 1; }
          if grep -R "WKWebView\|WebKit" Openly --include='*.swift'; then
            echo "Web wrapper code found" >&2
            exit 1
          fi

      - name: Package native IPA
        working-directory: ios
        run: |
          rm -rf Payload Openly-native-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Openly.app Payload/Openly.app
          zip -qry Openly-native-unsigned.ipa Payload
          shasum -a 256 Openly-native-unsigned.ipa > Openly-native-unsigned.ipa.sha256

      - name: Verify packaged IPA and record provenance
        working-directory: ios
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build_number="$(awk '/CURRENT_PROJECT_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          python3 ci/verify_ipa.py Openly-native-unsigned.ipa --build "$build_number" --report Openly-IPA-audit.json
          printf 'Source commit: %s\nThis IPA is unsigned. It requires signing and provisioning before installation.\n' "$SOURCE_COMMIT" > Openly-build.txt
          cat Openly-build.txt >> "$GITHUB_STEP_SUMMARY"
          cat Openly-IPA-audit.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Openly-native-unsigned-ipa
          path: |
            ios/Openly-native-unsigned.ipa
            ios/Openly-native-unsigned.ipa.sha256
            ios/Openly-IPA-audit.json
            ios/Openly-build.txt
          if-no-files-found: error
