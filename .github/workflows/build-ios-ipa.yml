name: Build Openly IPA

on:
  push:
    branches:
      - build-ios-ipa
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild \
            -project Openly.xcodeproj \
            -scheme Openly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Openly.app"
          test -d "$APP_PATH"
          rm -rf Payload Openly-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Openly.app
          zip -qry Openly-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Openly-unsigned-ipa
          path: ios/Openly-unsigned.ipa
          if-no-files-found: error
