name: Auth Preview Live Smoke

on:
  push:
    branches:
      - fix/auth-otp-oauth-native
    paths:
      - '.github/workflows/auth-preview-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_ORIGIN: https://deploy-preview-42--inspiring-swan-ab4737.netlify.app
      AUTH_SMOKE_EMAIL: auth-smoke@openly.ink
    steps:
      - name: Login page renders auth choices
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location "$PREVIEW_ORIGIN/login")"
          grep -q "Continue with Apple" <<<"$html"
          grep -q "Continue with Google" <<<"$html"
          grep -q "المتابعة برقم الهاتف" <<<"$html"

      - name: Email OTP request reaches auth backend
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error             -H 'content-type: application/json'             --data "{\"method\":\"email\",\"email\":\"$AUTH_SMOKE_EMAIL\"}"             "$PREVIEW_ORIGIN/api/auth/otp/request")"
          grep -q '"ok":true' <<<"$body"
          grep -q '"method":"email"' <<<"$body"
          if grep -q "$AUTH_SMOKE_EMAIL" <<<"$body"; then
            echo "Response leaked the raw email address" >&2
            exit 1
          fi

      - name: Wrong OTP is rejected safely
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error             -o /tmp/verify.json -w '%{http_code}'             -H 'content-type: application/json'             --data "{\"method\":\"email\",\"email\":\"$AUTH_SMOKE_EMAIL\",\"token\":\"000000\"}"             "$PREVIEW_ORIGIN/api/auth/otp/verify")"
          test "$code" = "400"
          grep -q '"error":' /tmp/verify.json

      - name: Invalid phone is rejected before SMS
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error             -o /tmp/phone.json -w '%{http_code}'             -H 'content-type: application/json'             --data '{"method":"phone","phone":"49123"}'             "$PREVIEW_ORIGIN/api/auth/otp/request")"
          test "$code" = "400"
          grep -q '"error":' /tmp/phone.json

      - name: OAuth starts use redirects
        shell: bash
        run: |
          set -euo pipefail
          for provider in google apple; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null               "$PREVIEW_ORIGIN/api/auth/oauth/$provider?next=/")"
            status="$(awk 'NR==1 {print $2}' <<<"$headers")"
            case "$status" in
              301|302|303|307|308) ;;
              *) echo "$provider did not return an OAuth redirect: $status" >&2; exit 1 ;;
            esac
          done
