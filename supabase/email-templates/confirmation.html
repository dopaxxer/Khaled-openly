<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>كود تأكيد Openly</title>
  </head>
  <body style="margin:0;background:#f7f7f5;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f7f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e7e2;border-radius:20px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.35;">تأكيد بريدك في Openly</h1>
                <p style="margin:0 0 24px;color:#5c5f6a;font-size:16px;line-height:1.8;">أدخل الكود التالي في الموقع أو التطبيق لإكمال إنشاء حسابك:</p>
                <div style="direction:ltr;text-align:center;letter-spacing:0.35em;font-size:34px;font-weight:700;background:#f2f3f8;border-radius:14px;padding:18px 12px;margin:0 0 24px;">{{ .Token }}</div>
                <p style="margin:0 0 18px;color:#5c5f6a;font-size:14px;line-height:1.8;">إذا تعذر إدخال الكود، يمكنك تأكيد البريد مباشرة من الزر التالي:</p>
                <p style="margin:0 0 24px;text-align:center;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5e77ee;color:#ffffff;text-decoration:none;border-radius:999px;padding:13px 24px;font-weight:700;">تأكيد البريد</a></p>
                <p style="margin:0;color:#858895;font-size:12px;line-height:1.7;">إذا لم تطلب إنشاء حساب في Openly فتجاهل هذه الرسالة. لا تشارك هذا الكود مع أي شخص.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
